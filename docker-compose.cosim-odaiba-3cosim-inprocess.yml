# docker compose -f docker-compose.cosim-odaiba-3cosim-inprocess.yml up -d
# =============================================================================
# お台場 3者 cosim の TeraSim 側(背景車両注入)— 単一プロセス版(Redis/gRPC なし)。
# =============================================================================
# 前提: 第1段階 start_3cosim_odaiba_psim.sh で CARLA :2013(odaibatest5) + psim + bridge 稼働済み。
# direct(gRPC 2 プロセス)版からの変更(= 第2段階の同一プロセス化):
#   - コンテナ内は terasim_service.run_cosim の 1 プロセスのみ
#     (TeraSim ループと CARLA クライアントループが同一プロセスの別スレッド)
#   - gRPC ポート・runner/client の起動順序管理が不要
# image は TERASIM_IMAGE で差し替え可(既定 = このブランチの build)。
# =============================================================================
services:
  terasim-3cosim:
    image: ${TERASIM_IMAGE:-terasim-service:inprocess}
    container_name: terasim-3cosim
    network_mode: host
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - HOME=/tmp
      - CARLA_PORT=2013
      - SCENARIO=${SCENARIO:-/app/examples/scenarios/cosim_odaiba_osmlike.yaml}
      # CARLA への変換適用・spawn を1リクエストに束ねる(既定 OFF の opt-in 高速化。
      # 背景車両数百台では per-actor RPC が支配的なので常時 ON にする)
      - CARLA_COSIM_BATCH_TRANSFORM=1
      - CARLA_COSIM_BATCH_SPAWN=1
      # ego(AV)周辺のみ CARLA に同期する間引き(既定 OFF、ホスト env で opt-in)
      - CARLA_COSIM_ACTOR_FILTER=${CARLA_COSIM_ACTOR_FILTER:-0}
      # TeraSim 側の state 構築も ego(AV)周辺に間引く(既定 OFF、ホスト env で opt-in)。
      # CARLA_COSIM_ACTOR_FILTER と同半径なら挙動等価のまま、state 構築コストが
      # 総台数比例 → 周辺台数比例になる(高台数域の主要な高速化)
      - TERASIM_COSIM_STATE_FILTER=${TERASIM_COSIM_STATE_FILTER:-0}
      - TERASIM_COSIM_STATE_FILTER_RADIUS=${TERASIM_COSIM_STATE_FILTER_RADIUS:-300}
    volumes:
      - ./examples:/app/examples
    command: ["/bin/bash", "/app/examples/scripts/run_3cosim_odaiba_inprocess.sh"]
    restart: "no"
