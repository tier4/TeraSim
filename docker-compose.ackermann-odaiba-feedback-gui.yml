services:
  terasim_ackermann_odaiba_feedback_gui:
    build:
      context: .
      dockerfile: Dockerfile.cosim
    image: ${TERASIM_GUI_IMAGE:-terasim-service:ackermann-feedback-gui}
    stop_grace_period: 90s
    networks:
      - carla_network
    ports:
      - "${SUMO_NOVNC_PORT:-6093}:6093"
      - "${SUMO_VNC_PORT:-5913}:5913"
    environment:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: development
      HOME: /tmp
      PYTHONPATH: /app/packages/terasim-service
      CARLA_HOST: "${CARLA_HOST:-carla-novnc-test}"
      CARLA_PORT: "${CARLA_PORT:-2000}"
      GRPC_PORT: "${GRPC_PORT:-8200}"
      TERASIM_CONFIG: "${TERASIM_CONFIG:-/app/examples/scenarios/cosim_odaiba_tlmappings_0708.yaml}"
      CARLA_COSIM_STEP_LENGTH: "${CARLA_COSIM_STEP_LENGTH:-0.1}"
      COSIM_EXPECTED_STEP_LENGTH: "${COSIM_EXPECTED_STEP_LENGTH:-0.05}"
      CARLA_COSIM_MAX_STEPS: "${CARLA_COSIM_MAX_STEPS:-0}"
      CARLA_COSIM_BATCH_TRANSFORM: "${CARLA_COSIM_BATCH_TRANSFORM:-1}"
      CARLA_COSIM_BATCH_SPAWN: "${CARLA_COSIM_BATCH_SPAWN:-1}"
      CARLA_COSIM_PHYSICS_RADIUS: "${CARLA_COSIM_PHYSICS_RADIUS:-0}"
      CARLA_COSIM_PHYSICS_RADIUS_CENTER_ID: "${CARLA_COSIM_PHYSICS_RADIUS_CENTER_ID:-AV}"
      CARLA_COSIM_PHYSICS_RADIUS_HYSTERESIS: "${CARLA_COSIM_PHYSICS_RADIUS_HYSTERESIS:-10}"
      CARLA_COSIM_PROFILE_STEPS: "${CARLA_COSIM_PROFILE_STEPS:-0}"
      CARLA_COSIM_PROFILE_JSONL: "${CARLA_COSIM_PROFILE_JSONL:-}"
      CARLA_COSIM_PROFILE_WARMUP_STEPS: "${CARLA_COSIM_PROFILE_WARMUP_STEPS:-0}"
      CARLA_COSIM_RANDOM_SEED: "${CARLA_COSIM_RANDOM_SEED:-}"
      CARLA_COSIM_ASYNC_MODE: "0"
      CARLA_COSIM_CONTROL_AV: "0"
      CARLA_COSIM_MAP_NAME: "${CARLA_COSIM_MAP_NAME:-}"
      CARLA_COSIM_VEHICLE_CONTROL_MODE: ackermann_physics
      CARLA_COSIM_ACKERMANN_FEEDBACK_MODE: "${CARLA_COSIM_ACKERMANN_FEEDBACK_MODE:-apply}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_LOG_RECORDS: "${CARLA_COSIM_ACKERMANN_FEEDBACK_LOG_RECORDS:-0}"
      CARLA_COSIM_ACKERMANN_CONTROL_LOG_RECORDS: "${CARLA_COSIM_ACKERMANN_CONTROL_LOG_RECORDS:-0}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_ACTORS: "${CARLA_COSIM_ACKERMANN_FEEDBACK_ACTORS:-AV}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_POSITION_MODE: "${CARLA_COSIM_ACKERMANN_FEEDBACK_POSITION_MODE:-moveTo}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_MOVE_TO_MAX_DISTANCE: "${CARLA_COSIM_ACKERMANN_FEEDBACK_MOVE_TO_MAX_DISTANCE:-8.0}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_BACKGROUND_MOVE_TO_MAX_DISTANCE: "${CARLA_COSIM_ACKERMANN_FEEDBACK_BACKGROUND_MOVE_TO_MAX_DISTANCE:-}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_MOVE_TO_LANE_HYSTERESIS: "${CARLA_COSIM_ACKERMANN_FEEDBACK_MOVE_TO_LANE_HYSTERESIS:-0.35}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_LANE_INDEX: "${CARLA_COSIM_ACKERMANN_FEEDBACK_LANE_INDEX:-0}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_KEEP_ROUTE: "${CARLA_COSIM_ACKERMANN_FEEDBACK_KEEP_ROUTE:-0}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_LOG_LANE_TRANSITIONS: "${CARLA_COSIM_ACKERMANN_FEEDBACK_LOG_LANE_TRANSITIONS:-0}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_LC_KEEP_RIGHT: "${CARLA_COSIM_ACKERMANN_FEEDBACK_LC_KEEP_RIGHT:-}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_LC_KEEP_RIGHT_ACTORS: "${CARLA_COSIM_ACKERMANN_FEEDBACK_LC_KEEP_RIGHT_ACTORS:-AV}"
      CARLA_COSIM_ACKERMANN_FEEDBACK_SPEED_HORIZON: "${CARLA_COSIM_ACKERMANN_FEEDBACK_SPEED_HORIZON:-1.0}"
      CARLA_COSIM_ACKERMANN_CONTROLLER_SPEED_KP: "${CARLA_COSIM_ACKERMANN_CONTROLLER_SPEED_KP:-0.15}"
      CARLA_COSIM_ACKERMANN_CONTROLLER_SPEED_KI: "${CARLA_COSIM_ACKERMANN_CONTROLLER_SPEED_KI:-0.0}"
      CARLA_COSIM_ACKERMANN_CONTROLLER_SPEED_KD: "${CARLA_COSIM_ACKERMANN_CONTROLLER_SPEED_KD:-0.25}"
      CARLA_COSIM_ACKERMANN_CONTROLLER_ACCEL_KP: "${CARLA_COSIM_ACKERMANN_CONTROLLER_ACCEL_KP:-0.01}"
      CARLA_COSIM_ACKERMANN_CONTROLLER_ACCEL_KI: "${CARLA_COSIM_ACKERMANN_CONTROLLER_ACCEL_KI:-0.0}"
      CARLA_COSIM_ACKERMANN_CONTROLLER_ACCEL_KD: "${CARLA_COSIM_ACKERMANN_CONTROLLER_ACCEL_KD:-0.01}"
      CARLA_COSIM_ACTOR_FILTER: "${CARLA_COSIM_ACTOR_FILTER:-1}"
      CARLA_COSIM_ACTOR_FILTER_CENTER_ID: "${CARLA_COSIM_ACTOR_FILTER_CENTER_ID:-AV}"
      CARLA_COSIM_ACTOR_FILTER_RADIUS: "${CARLA_COSIM_ACTOR_FILTER_RADIUS:-300}"
      CARLA_COSIM_ACTOR_FILTER_HYSTERESIS: "${CARLA_COSIM_ACTOR_FILTER_HYSTERESIS:-20}"
      TERASIM_COSIM_STATE_FILTER: "${TERASIM_COSIM_STATE_FILTER:-1}"
      TERASIM_COSIM_STATE_FILTER_CENTER_ID: "${TERASIM_COSIM_STATE_FILTER_CENTER_ID:-AV}"
      TERASIM_COSIM_STATE_FILTER_RADIUS: "${TERASIM_COSIM_STATE_FILTER_RADIUS:-320}"
      TERASIM_COSIM_STATE_MAX_VEHICLES: "${TERASIM_COSIM_STATE_MAX_VEHICLES:-0}"
      TERASIM_COSIM_STATE_CONTEXT_SUBSCRIPTION: "${TERASIM_COSIM_STATE_CONTEXT_SUBSCRIPTION:-1}"
      TERASIM_COSIM_STATE_DETAIL_RADIUS: "${TERASIM_COSIM_STATE_DETAIL_RADIUS:-}"
      TERASIM_COSIM_STATE_DETAIL_HYSTERESIS: "${TERASIM_COSIM_STATE_DETAIL_HYSTERESIS:-10}"
      TERASIM_COSIM_CONTINUE_ON_ACKERMANN_FEEDBACK_FAILURE: "${TERASIM_COSIM_CONTINUE_ON_ACKERMANN_FEEDBACK_FAILURE:-0}"
      TERASIM_COSIM_PROFILE_STEPS: "${TERASIM_COSIM_PROFILE_STEPS:-0}"
      TERASIM_COSIM_PROFILE_JSONL: "${TERASIM_COSIM_PROFILE_JSONL:-}"
      TERASIM_COSIM_CONSOLE_LOG_LEVEL: "${TERASIM_COSIM_CONSOLE_LOG_LEVEL:-WARNING}"
      ENABLE_SUMO_GUI: "${ENABLE_SUMO_GUI:-1}"
      SUMO_DISPLAY: "${SUMO_DISPLAY:-:20}"
      SUMO_NOVNC_PORT: "6093"
      SUMO_VNC_PORT: "5913"
      VNC_PASSWORD: "${VNC_PASSWORD:-headless}"
      SUMO_GUI_TRACK_VEHICLE: "${SUMO_GUI_TRACK_VEHICLE:-1}"
      SUMO_GUI_TRACK_ZOOM: "${SUMO_GUI_TRACK_ZOOM:-3000}"
      SUMO_GUI_REALTIME: "${SUMO_GUI_REALTIME:-1}"
    volumes:
      - ${TERASIM_EXAMPLES_HOST_DIR:-./examples}:/app/examples:ro
      - ./outputs:/app/outputs
      - ./scripts:/app/scripts:ro
    command: ["/bin/bash", "/app/scripts/run_ackermann_odaiba_feedback_gui_container.sh"]

networks:
  carla_network:
    external: true
    name: ${CARLA_DOCKER_NETWORK:-terasim_default}
